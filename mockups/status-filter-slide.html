<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ludothèque — Maquette sélecteur glissant (filtre de statut)</title>
<style>
  :root {
    color-scheme: dark;
    --foreground: #eef1fb; --muted: rgba(238, 241, 251, 0.58); --faint: rgba(238, 241, 251, 0.38);
    --bg-base: #0c0e1a; --bg-blob-1: rgba(124, 92, 214, 0.5); --bg-blob-2: rgba(24, 116, 130, 0.45);
    --glass-bg: rgba(255, 255, 255, 0.07); --glass-bg-strong: rgba(255, 255, 255, 0.11);
    --glass-border: rgba(255, 255, 255, 0.14); --glass-highlight: rgba(255, 255, 255, 0.22);
    --glass-shadow: rgba(0, 0, 0, 0.4);
    --accent: #f2ab2e; --accent-ink: #241300;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg-base); color: var(--foreground); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  h1 { margin: 0; }
  .app-bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(120% 80% at 12% 0%, var(--bg-blob-1) 0%, transparent 55%), radial-gradient(120% 90% at 95% 15%, var(--bg-blob-2) 0%, transparent 50%), var(--bg-base); }
  .shell { max-width: 460px; margin: 0 auto; min-height: 100vh; position: relative; }
  .px { padding-left: 1.1rem; padding-right: 1.1rem; }
  header.page { padding: 1.6rem 1.1rem 1.2rem; }
  header.page h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
  .note { margin: 0 1.1rem 1.4rem; padding: 0.8rem 0.9rem; border-radius: 0.9rem; font-size: 0.78rem; color: var(--muted); background: var(--glass-bg); border: 1px solid var(--glass-border); }

  /*
   * Dimensions IDENTIQUES à l'existant (.segment / .segment-item-stacked déjà en prod) : même
   * padding, même taille d'icône/texte pour l'état actif. Rien ne bouge dans la disposition —
   * seul le comportement du sélecteur et la visibilité du texte changent.
   */
  .segment {
    position: relative;
    display: flex;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 9999px;
  }
  .segment-item {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.15rem;
    padding: 0.5rem 0.2rem;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 9999px;
    cursor: pointer;
  }
  /*
   * L'icône vit dans son propre wrapper, décalé verticalement en `translateY` (calculé en JS
   * une fois au chargement, à partir de la hauteur réelle du label + du gap) : actif = 0 (icône
   * au-dessus du texte, position actuelle) ; inactif = décalée vers le bas pour se retrouver
   * exactement au centre vertical de la tuile, comme si le texte n'avait jamais existé. C'est
   * ce décalage qui est animé, pas juste l'opacité du texte — c'est lui qui donne le mouvement
   * "l'icône descend/remonte" demandé.
   */
  .icon-wrap {
    display: flex;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .segment-item:not([data-active="true"]) .icon-wrap { transform: translateY(var(--icon-shift, 0.45rem)); }

  .segment-item svg {
    width: 1.15rem; height: 1.15rem;
    transition: width 0.25s ease, height 0.25s ease, color 0.2s ease;
  }
  .segment-item[data-active="true"] { color: var(--accent-ink); font-weight: 600; }
  .segment-item:not([data-active="true"]) svg { width: 1.35rem; height: 1.35rem; }

  /* Le texte : fondu croisé (sortant disparaît, entrant apparaît), toujours en place dans le
     flux (jamais de display:none) pour que le calcul du décalage ci-dessus reste correct. */
  .segment-item .label {
    font-size: 0.62rem; font-weight: 600;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .segment-item[data-active="true"] .label { opacity: 1; transition-delay: 0.12s; }
  .segment-item:not([data-active="true"]) .label { transition-delay: 0s; }

  /* Le sélecteur : un seul élément qui glisse en CSS pur (translateX en %, relatif à sa PROPRE
     largeur = 1/5 du conteneur) — aucune mesure JS, donc aucun recalcul nécessaire au resize,
     intrinsèquement responsive. */
  .segment-indicator {
    position: absolute;
    top: 0; left: 0;
    width: 20%; height: 100%;
    border-radius: 9999px;
    background: var(--accent);
    z-index: 1;
    transition: transform 0.4s cubic-bezier(0.65, 0, 0.35, 1);
  }
</style>
</head>
<body>
<div class="app-bg" aria-hidden="true"></div>
<div class="shell">
  <header class="page"><h1>Bibliothèque</h1></header>

  <div class="note">
    Maquette : mêmes dimensions qu'aujourd'hui. Clique un filtre — le sélecteur jaune glisse
    (CSS pur), le texte de l'ancien actif s'efface en fondu, celui du nouveau apparaît en fondu,
    et les icônes inactives grossissent légèrement pour combler l'espace du texte.
  </div>

  <div class="px">
    <div class="segment" id="bar">
      <div class="segment-indicator" id="indicator"></div>
      <button class="segment-item" data-active="true" data-key="tous">
        <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.3"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.3"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.3"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.3"/></svg></span>
        <span class="label">Tous</span>
      </button>
      <button class="segment-item" data-key="afaire">
        <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"/></svg></span>
        <span class="label">À faire</span>
      </button>
      <button class="segment-item" data-key="encours">
        <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg></span>
        <span class="label">En cours</span>
      </button>
      <button class="segment-item" data-key="termine">
        <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l4.5 4.5 10.5-11"/></svg></span>
        <span class="label">Terminé</span>
      </button>
      <button class="segment-item" data-key="abandonne">
        <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
        <span class="label">Abandonné</span>
      </button>
    </div>
  </div>
</div>

<script>
  const bar = document.getElementById('bar');
  const items = [...document.querySelectorAll('.segment-item')];
  const indicator = document.getElementById('indicator');

  // Décalage exact = moitié de (gap + hauteur du label), mesuré pour de vrai plutôt que
  // deviné : c'est ce qui fait atterrir l'icône pile au centre vertical de la tuile une fois
  // le texte masqué, quel que soit le rendu de police du navigateur/appareil.
  function computeIconShift() {
    const label = items[0].querySelector('.label');
    const gap = parseFloat(getComputedStyle(items[0]).rowGap || getComputedStyle(items[0]).gap || '0');
    const labelHeight = label.getBoundingClientRect().height;
    const shift = (gap + labelHeight) / 2;
    bar.style.setProperty('--icon-shift', `${shift}px`);
  }
  computeIconShift();
  window.addEventListener('resize', computeIconShift);

  items.forEach((btn, i) => {
    btn.addEventListener('click', () => {
      items.forEach((b) => (b.dataset.active = 'false'));
      btn.dataset.active = 'true';
      indicator.style.transform = `translateX(${i * 100}%)`;
    });
  });
</script>
</body>
</html>
